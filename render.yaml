# Render blueprint. Secrets are NOT stored here -- every `sync: false` value is
# entered once in the Render dashboard.
#
# The database is Neon rather than a Render Postgres, because pgvector plus a
# generous free tier is what this needs. Use Neon's POOLED connection string.
#
# The nightly session cleanup is NOT here: Render cron services have no free
# plan. It runs as a GitHub Actions schedule instead
# (.github/workflows/cleanup.yml), which only needs DATABASE_URL and does not
# depend on the web service being awake.

services:
  - type: web
    name: rag-inspector-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    # Points at /ready, not /health: /health only proves the process started,
    # and would report green while the database is unreachable.
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # The static site's URL below. Required in production.
        sync: false

  - type: web
    name: rag-inspector-web
    runtime: static
    # No `plan` key: static sites are free and unmetered, and Render rejects
    # the field on this service type.
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time, so changing it needs a rebuild.
      - key: VITE_API_BASE
        sync: false
    routes:
      # Single-page app: every unknown path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
