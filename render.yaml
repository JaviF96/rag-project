# Render blueprint. Secrets are NOT stored here -- every `sync: false` value is
# entered once in the Render dashboard.
#
# The database is Neon rather than a Render Postgres, because pgvector plus a
# generous free tier is what this needs. Use Neon's POOLED connection string.

services:
  - type: web
    name: rag-inspector-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    # Points at /ready, not /health: /health only proves the process started,
    # and would report green while the database is unreachable.
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # The static site's URL below. Required in production.
        sync: false

  - type: web
    name: rag-inspector-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time, so changing it needs a rebuild.
      - key: VITE_API_BASE
        sync: false
    routes:
      # Single-page app: every unknown path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html

  # Nothing else deletes uploaded documents, so without this the table grows
  # without bound.
  - type: cron
    name: rag-inspector-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    schedule: "0 3 * * *"
    dockerCommand: python -m seed.cleanup_sessions
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: SESSION_TTL_DAYS
        value: "7"
